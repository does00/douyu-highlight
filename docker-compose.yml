# 斗鱼录制 + 精彩片段流水线（黑群晖 Docker）
#
# 容器：
#   bililive      - biliLive-tools 后端：录制 + B站投稿 API（:18010）
#   highlight     - 精彩片段流水线：转写 + 双信号打分 + 剪辑 + 投稿
#
# 首次启动后：
#   1. 用 biliLive-tools 的 API 添加斗鱼房间并开启自动录制
#      （房间管理：POST http://NAS_IP:18010/recorder/add，见 biliLive-tools 文档）
#   2. 在 B站账号管理里扫码登录（投稿用）

services:
  bililive:
    image: renmu1234/bililive-tools-backend
    container_name: bililive
    ports:
      - "18010:18010"
    volumes:
      # 配置持久化（appConfig.json、房间、账号）
      - ./bililive-data:/app/data
      # 录像输出：highlight 容器挂载同一目录读取
      - ./recordings:/app/video
      # 成片目录：highlight 投稿时传给 API 的路径（/work/highlights）必须可见
      - ./highlight-work:/work
    environment:
      - TZ=Asia/Shanghai
      - BILILIVE_TOOLS_PASSKEY=${BILILIVE_PASSKEY:?请在 .env 里设置 BILILIVE_PASSKEY}
      - BILILIVE_TOOLS_BILIKEY=${BILILIVE_BILIKEY:-bililive-tools}
    restart: unless-stopped

  highlight:
    # 预构建镜像（GitHub Actions 自动构建推送）；如需本地构建，注释掉 image 行、取消下面 build 行的注释
    image: ghcr.io/does00/douyu-highlight:latest
    # build: ./highlight
    container_name: highlight
    volumes:
      # 只读挂载录像目录
      - ./recordings:/recordings:ro
      # 工作目录：转写缓存、state、日志（持久化）
      - ./highlight-work:/work
    environment:
      - TZ=Asia/Shanghai
      - BILILIVE_API=http://bililive:18010
      - BILILIVE_PASSKEY=${BILILIVE_PASSKEY:?请在 .env 里设置 BILILIVE_PASSKEY}
      # 录像目录（biliLive 按主播分子目录）
      - SEGDIR=/recordings/兔了了丶
      - STREAMER_NAME=兔了了丶
      - DOUYU_ROOM_ID=6570336
      - BILI_UID=500604364
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      # LLM（可选）：DeepSeek 直连（NAS/国内推荐）
      # .env 里填 DEEPSEEK_API_KEY=sk-... 和 HTTPS_PROXY=http://局域网v2ray:端口
      # Gemini 直连：LLM_PROVIDER=gemini + GEMINI_API_KEY
      # 中继模式（本机）：LLM_API_URL=http://宿主机:18020/generate + LLM_API_TOKEN=xxx
      # 录像保留天数：0=永久保留（默认），N=处理完N天后删除.ts/.xml
      - RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS:-0}
    depends_on:
      - bililive
    restart: unless-stopped

  highlight-status:
    image: ghcr.io/does00/douyu-highlight:latest
    container_name: highlight-status
    ports:
      - "18022:18022"
    volumes:
      - ./highlight-work:/work
    environment:
      - TZ=Asia/Shanghai
      - PORT=18022
      - WORKDIR=/work/highlights
      - STATE=/work/highlight-state.json
      - LOG=/work/highlight.log
      - RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS:-0}
    command: ["python3", "/app/highlight-status.py"]
    depends_on:
      - highlight
    restart: unless-stopped
