# 斗鱼录制 + 精彩片段流水线（黑群晖 Docker）
#
# 容器：
#   bililive      - biliLive-tools 后端：录制 + B站投稿 API（:18010）
#   bililive-web  - biliLive-tools 前端：Web 管理界面（:13000）
#   highlight     - 精彩片段流水线：转写 + 双信号打分 + 剪辑 + 投稿
#
# 首次启动后：
#   1. 打开 http://NAS_IP:13000，填 API 地址 http://NAS_IP:18010 和下方 PASSKEY 登录
#   2. 在 Web 界面添加斗鱼房间 6570336，开启自动录制
#   3. 在 B站账号管理里扫码登录（投稿用）

services:
  bililive:
    image: renmu1234/bililive-tools-backend
    container_name: bililive
    ports:
      - "18010:18010"
    volumes:
      # 配置持久化（appConfig.json、房间、账号）
      - ./bililive-data:/app/data
      # 录像输出：highlight 容器挂载同一目录读取
      - ./recordings:/app/video
    environment:
      - TZ=Asia/Shanghai
      - BILILIVE_TOOLS_PASSKEY=${BILILIVE_PASSKEY:?请在 .env 里设置 BILILIVE_PASSKEY}
      - BILILIVE_TOOLS_BILIKEY=${BILILIVE_BILIKEY:-bililive-tools}
    restart: unless-stopped

  bililive-web:
    image: renmu1234/bililive-tools-frontend
    container_name: bililive-web
    ports:
      - "13000:3000"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - bililive
    restart: unless-stopped

  highlight:
    # 预构建镜像（GitHub Actions 自动构建推送）；如需本地构建，注释掉 image 行、取消下面 build 行的注释
    image: ghcr.io/does00/douyu-highlight:latest
    # build: ./highlight
    container_name: highlight
    volumes:
      # 只读挂载录像目录
      - ./recordings:/recordings:ro
      # 工作目录：转写缓存、state、日志（持久化）
      - ./highlight-work:/work
    environment:
      - TZ=Asia/Shanghai
      - BILILIVE_API=http://bililive:18010
      - BILILIVE_PASSKEY=${BILILIVE_PASSKEY:?请在 .env 里设置 BILILIVE_PASSKEY}
      # 录像目录（biliLive 按主播分子目录）
      - SEGDIR=/recordings/兔了了丶
      - STREAMER_NAME=兔了了丶
      - DOUYU_ROOM_ID=6570336
      - BILI_UID=500604364
      # LLM 标题（可选）：填了就用，不填则只用时间标题
      # - LLM_API_URL=http://宿主机:18020/generate
      # - LLM_API_TOKEN=xxx
    depends_on:
      - bililive
    restart: unless-stopped
